# Infraestructura de DEMOSTRACIÓN (no es parte de la aplicación): un Oracle con la metadata y bases de
# ejemplo, y un Keycloak con usuarios de prueba. Sirve para probar DBA Manager sin servidores propios.
#   docker compose -f demo/docker-compose.yml --env-file .env up -d
# Oracle 18c para pruebas de compatibilidad: añadir --profile compat
name: dbamanager

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: dbamanager-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-}
      DBAMGR_PASSWORD: ${DBAMGR_PASSWORD:-}
      CATALOG_PASSWORD: ${CATALOG_PASSWORD:-}
      EXECUTOR_PASSWORD: ${EXECUTOR_PASSWORD:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: dbamanager-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dbamanager}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-dbamanager-web}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8180"
    volumes:
      - ./keycloak/realm-dbamanager.json:/opt/keycloak/data/import/realm-dbamanager.json:ro
      - keycloak-data:/opt/keycloak/data

  oracle18:
    image: gvenzl/oracle-xe:18-slim
    container_name: dbamanager-oracle18
    profiles: ["compat"]
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-}
      CATALOG_PASSWORD: ${CATALOG_PASSWORD:-}
      EXECUTOR_PASSWORD: ${EXECUTOR_PASSWORD:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "1522:1521"
    volumes:
      - oracle18-data:/opt/oracle/oradata
      - ./oracle/init18:/container-entrypoint-initdb.d:ro
      - ../scripts/oracle/cuentas_servicio.sql:/opt/dbamanager/cuentas_servicio.sql:ro
      - ./oracle/init/demo_schemas.sql.txt:/opt/dbamanager/demo_schemas.sql.txt:ro

volumes:
  oracle-data:
  keycloak-data:
  oracle18-data:

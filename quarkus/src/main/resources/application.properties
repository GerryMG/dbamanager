# Toda la configuración llega por variables de entorno (o por el archivo .env de la carpeta donde
# se ejecuta). Ver .env.example. Aquí solo se traducen a las propiedades de Quarkus.

# ------------------------------------------------------------------ Aplicación
quarkus.application.name=dbamanager
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.banner.enabled=false
quarkus.http.limits.max-body-size=${RESTORE_MAX_MB:50}M
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=false
quarkus.http.proxy.trusted-proxies=${FORWARDED_ALLOW_IPS:127.0.0.1}
quarkus.http.header."Server".value=dbamanager
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.serialization-inclusion=always

# ------------------------------------------------------------------ Metadata (Oracle 12.1+)
quarkus.datasource.db-kind=oracle
quarkus.datasource.jdbc.url=jdbc:oracle:thin:@${METADATA_DSN:localhost:1521/DBAMGRPDB}
quarkus.datasource.username=${METADATA_USER:DBAMGR}
quarkus.datasource.password=${DBAMGR_PASSWORD:change_me}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=${METADATA_POOL_SIZE:15}
quarkus.datasource.jdbc.acquisition-timeout=15S
quarkus.datasource.jdbc.additional-jdbc-properties.oracle.net.CONNECT_TIMEOUT=10000
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.jdbc.statement-fetch-size=200
quarkus.flyway.migrate-at-start=true
quarkus.flyway.table=DBAMGR_SCHEMA_HISTORY
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.validate-on-migrate=true

# ------------------------------------------------------------------ Inicio de sesión (OIDC / Keycloak)
quarkus.oidc.application-type=web-app
quarkus.oidc.auth-server-url=${dbamanager.oidc.server-url}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:dbamanager-web}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:}
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.scopes=profile,email
quarkus.oidc.authentication.verify-access-token=true
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.session-age-extension=10M
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/
quarkus.oidc.discovery-enabled=true
quarkus.oidc.connection-timeout=10S
quarkus.oidc.connection-retry-count=5

# Reautenticación (pide la contraseña aunque haya sesión abierta en Keycloak). Su cookie solo
# viaja a /reauth.
quarkus.oidc.reauth.auth-server-url=${dbamanager.oidc.server-url}
quarkus.oidc.reauth.client-id=${KEYCLOAK_CLIENT_ID:dbamanager-web}
quarkus.oidc.reauth.credentials.secret=${KEYCLOAK_CLIENT_SECRET:}
quarkus.oidc.reauth.application-type=web-app
quarkus.oidc.reauth.tenant-paths=/reauth,/reauth/*
quarkus.oidc.reauth.authentication.pkce-required=true
quarkus.oidc.reauth.authentication.extra-params.prompt=login
quarkus.oidc.reauth.authentication.cookie-path=/reauth
quarkus.oidc.reauth.authentication.cookie-suffix=reauth
quarkus.oidc.reauth.token-state-manager.strategy=id-token
quarkus.oidc.reauth.token.lifespan-grace=10

# Todo exige sesión, salvo los chequeos de salud del contenedor
quarkus.http.auth.permission.health.paths=/q/health,/q/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.app.paths=/*
quarkus.http.auth.permission.app.policy=authenticated

quarkus.smallrye-health.ui.enabled=false
